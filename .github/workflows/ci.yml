name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
        env:
          ANTCREW_SANDBOX: none   # host Python path doesn't exist inside Docker image

  pypi-compat:
    name: PyPI compat (published wheel)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install published antcrew-engine from PyPI (not editable)
        run: pip install "antcrew-engine[dev]"

      - name: Run tests against installed wheel
        run: python -m pytest tests/ -q --tb=short
        env:
          ANTCREW_SANDBOX: none

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting and style
        run: ruff check antcrew_engine/

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and security tools
        run: |
          pip install -e ".[dev]"
          pip install "bandit[toml]" pip-audit

      - name: bandit — static security analysis (MEDIUM+)
        # -ll  skip LOW severity   -ii  skip LOW confidence
        run: bandit -r antcrew_engine/ -ll -ii

      - name: pip-audit — dependency CVE scan
        run: pip-audit

  changelog:
    name: CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check CHANGELOG entry for current version
        run: |
          python3 - << 'PYEOF'
          import tomllib, sys
          with open("pyproject.toml", "rb") as f:
              v = tomllib.load(f)["project"]["version"]
          with open("CHANGELOG.md") as f:
              content = f.read()
          if f"[{v}]" not in content:
              print(f"::error::CHANGELOG.md is missing an entry for version {v}")
              sys.exit(1)
          print(f"OK: CHANGELOG.md has entry for [{v}]")
          PYEOF
